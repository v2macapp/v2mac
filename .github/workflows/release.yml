name: Release

# Push a tag like v0.2.0 (Scripts/release.sh 0.2.0 does it) to publish a release.
# "Run workflow" builds everything but publishes nothing (dry run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Dry run - version to build (nothing is published)
        default: 0.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: brew install xcodegen bsdiff

      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${{ inputs.version }}"
          fi
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The app's version comes from the tag.
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"/" project.yml

      - run: Scripts/fetch-core.sh

      - name: Package tests
        timeout-minutes: 8
        env:
          NSUnbufferedIO: "YES"
        run: swift test
        working-directory: Packages/V2MacCore

      - name: Build DMG
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # Optional: a base64 .p12 with an Apple-issued code signing identity and its password. Any team ID
          # lets Shortcuts run the app's actions; without it the app is ad-hoc signed and they fail.
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          # Without the signature, every installed copy would refuse this release as an update.
          if [[ -z "$UPDATE_SIGNING_KEY" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is not set"; exit 1
          fi
          if [[ -n "$SIGNING_CERT_P12" ]]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; KEYCHAIN_PASSWORD="$(uuidgen)"
            echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            export SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')"
            [[ -n "$SIGN_IDENTITY" ]] || { echo "::error::SIGNING_CERT_P12 holds no code signing identity"; exit 1; }
          else
            echo "::warning::SIGNING_CERT_P12 is not set: ad-hoc signed, Shortcuts actions will not run"
          fi
          Scripts/make-dmg.sh
          ARCH=x86_64 Scripts/fetch-core.sh
          ARCH=x86_64 Scripts/make-dmg.sh

      # The in-app updater's file-by-file release (docs/app-auto-update.md): per-file zips, bsdiff patches
      # from the last 3 releases' DMGs, and the signed files.json.
      - name: Package update files
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          Scripts/package-update.sh build/Build/Products/Release/V2Mac.app dist/update "${{ steps.v.outputs.tag }}"
          Scripts/package-update.sh build-intel/Build/Products/Release/V2Mac.app dist/update-intel "${{ steps.v.outputs.tag }}" intel_
          if [[ -n "$UPDATE_SIGNING_KEY" ]]; then
            Scripts/sign-update.swift dist/update/files.json
            Scripts/sign-update.swift dist/update-intel/files-intel.json
          fi
          find dist -type f | sort

      - name: Release notes
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TO="$TAG"; PREVIOUS="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          else
            TO=HEAD; PREVIOUS="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi
          {
            echo "## What's changed"
            echo
            Scripts/changelog.sh "$PREVIOUS" "$TO"
            echo
            echo "## Install"
            echo
            echo "With Homebrew: \`brew install --cask v2macapp/tap/v2mac\` (or \`brew upgrade --cask v2mac\`)."
            echo
            echo "Requires macOS 14 or later. Choose \`V2Mac-${{ steps.v.outputs.version }}.dmg\` for Apple Silicon or \`V2Mac-${{ steps.v.outputs.version }}-intel.dmg\` for Intel. Check the matching \`.sha256\` file and follow the first-launch steps in the README."
            echo
            echo "Secure Sandbox requires Apple Silicon and macOS 26 or later. Control Center and Liquid Glass require macOS 26."
            echo
            echo "Validation: both architectures build locally; the native core and app-state suites pass. Full macOS 14/15 behavior, real Intel TUN, and live glass equivalence remain acceptance checks."
            [[ -n "$PREVIOUS" ]] && echo && echo "Full changelog: https://github.com/${{ github.repository }}/compare/$PREVIOUS...$TAG"
          } > notes.md
          cat notes.md

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The website's Download button uses releases/latest/download/V2Mac.dmg, which needs a name without the version.
          cp "dist/V2Mac-${{ steps.v.outputs.version }}.dmg" "$RUNNER_TEMP/V2Mac.dmg"
          cp "dist/V2Mac-${{ steps.v.outputs.version }}-intel.dmg" "$RUNNER_TEMP/V2Mac-Intel.dmg"
          gh release create "${{ steps.v.outputs.tag }}" dist/*.dmg "$RUNNER_TEMP/V2Mac.dmg" "$RUNNER_TEMP/V2Mac-Intel.dmg" dist/*.sha256 dist/*.sig dist/update/* dist/update-intel/* \
            --title "V2Mac ${{ steps.v.outputs.version }}" --notes-file notes.md

      # Rebuilds the website with the new version and notes. Needs a SITE_TOKEN secret that can write
      # contents of v2macapp/v2macapp.github.io. The release is out, so a failure here only warns.
      - name: Rebuild the website
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then echo "::warning::SITE_TOKEN is not set; the website was not rebuilt"; exit 0; fi
          gh api repos/v2macapp/v2macapp.github.io/dispatches -f event_type=release || echo "::warning::The website rebuild did not start"

      # Points the Homebrew cask (v2macapp/homebrew-tap) at the new DMG. Needs a TAP_TOKEN
      # secret with write access to that repo; fails without one so a skipped bump is noticed.
      - name: Update Homebrew tap
        if: github.ref_type == 'tag'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::TAP_TOKEN is not set; the release is out but Casks/v2mac.rb in v2macapp/homebrew-tap was not bumped"
            exit 1
          fi
          SHA="$(shasum -a 256 "dist/V2Mac-$VERSION.dmg" | cut -d' ' -f1)"
          INTEL_SHA="$(shasum -a 256 "dist/V2Mac-$VERSION-intel.dmg" | cut -d' ' -f1)"
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/v2macapp/homebrew-tap.git" tap
          cd tap
          VERSION="$VERSION" ARM_SHA="$SHA" INTEL_SHA="$INTEL_SHA" python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          p = Path("Casks/v2mac.rb")
          text = re.sub(r'^  version ".*"', '  version "' + os.environ["VERSION"] + '"', p.read_text(), flags=re.M)
          if "on_arm do" not in text:
              def architectures(match):
                  url = match[1]
                  return ('\n  on_arm do\n    sha256 "' + os.environ["ARM_SHA"] + '"\n\n    url "' + url + '"\n  end\n'
                          '  on_intel do\n    sha256 "' + os.environ["INTEL_SHA"] + '"\n\n    url "' + url.removesuffix(".dmg") + '-intel.dmg"\n  end\n')
              text, count = re.subn(r'^  sha256 "[^\n]+"\n\n  url "([^\n]+)"', architectures, text, flags=re.M)
              assert count == 1, "Unrecognized legacy cask layout"
          text = text.replace("  depends_on arch: :arm64\n", "").replace("depends_on macos: :tahoe", "depends_on macos: :sonoma")
          for block, key in [("arm", "ARM_SHA"), ("intel", "INTEL_SHA")]:
              text, count = re.subn(r'(on_' + block + r' do\s+sha256 )[^\n]+', r'\g<1>"' + os.environ[key] + '"', text)
              assert count == 1, "Missing cask architecture block: " + block
          p.write_text(text)
          PYTHON
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "Update v2mac to $VERSION"
          git push -q

      - name: Dry run output
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ steps.v.outputs.version }}
          path: |
            dist/*
            notes.md
